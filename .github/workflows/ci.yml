name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build and test contracts
        working-directory: packages/adapter-evm
        run: |
          forge install foundry-rs/forge-std@v1.17.0 --no-git
          forge build
          forge test
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  python-verifier:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install receptum-verify
        run: python -m pip install -e "verifiers/python[test]"
      - name: Offline tests (vectors, RFC 8785, live receipt offline, tampered receipt)
        working-directory: verifiers/python
        env:
          RECEPTUM_OFFLINE: "1"
        run: python -m pytest -m "not online" -v
