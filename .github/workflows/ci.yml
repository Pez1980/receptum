name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build and test contracts
        working-directory: packages/adapter-evm
        run: |
          forge install foundry-rs/forge-std@v1.17.0 --no-git
          forge build
          forge test
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  python-verifier:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install receptum-verify
        run: python -m pip install -e "verifiers/python[test]"
      - name: Offline tests (vectors, RFC 8785, live receipt offline, tampered receipt)
        working-directory: verifiers/python
        env:
          RECEPTUM_OFFLINE: "1"
        run: python -m pytest -m "not online" -v

  soroban:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/adapter-stellar/contracts/receptum-escrow
    steps:
      - uses: actions/checkout@v7
      # Version, wasm target and components come from the contract's rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32v1-none
          components: rustfmt, clippy
      - name: Format, lint and test the Soroban escrow
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Install stellar-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version
      - name: Build the contract wasm and compare it with the committed (deployed) build
        run: |
          stellar contract build
          built=$(sha256sum target/wasm32v1-none/release/receptum_escrow.wasm | cut -d' ' -f1)
          committed=$(sha256sum receptum_escrow.wasm | cut -d' ' -f1)
          echo "built $built, committed $committed"
          # Enforced: the deployed wasm (built on macOS aarch64) reproduces bit-for-bit on Linux x86_64.
          [ "$built" = "$committed" ] || { echo "::error::receptum_escrow.wasm does not match the committed (deployed) build"; exit 1; }

  solana-program:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/adapter-solana/program
    steps:
      - uses: actions/checkout@v7
      - name: Install Agave 4.3.0 (pinned; same toolchain as the deployed build)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build the program and compare it with the committed (deployed) build
        run: |
          cargo-build-sbf --version
          cargo-build-sbf -- --locked
          hash() { python3 -c 'import hashlib,sys; d=open(sys.argv[1],"rb").read().rstrip(b"\0"); print(hashlib.sha256(d).hexdigest())' "$1"; }
          built=$(hash target/deploy/receptum_escrow.so)
          committed=$(hash receptum_escrow.so)
          echo "built $built, committed $committed"
          [ "$built" = "$committed" ] || { echo "::error::receptum_escrow.so does not match the committed (deployed) build"; exit 1; }
      - name: Keep the CI build for comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receptum_escrow-ci-build
          path: packages/adapter-solana/program/target/deploy/receptum_escrow.so
